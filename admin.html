<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrations Admin — PEISCL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fafafa;
            color: #1d1d1f;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid #d2d2d7;
            padding-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #6e6e73;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
        }

        .filters {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #5856d6;
            color: white;
        }

        .btn-primary:hover {
            background: #4745b5;
        }

        .btn-secondary {
            background: white;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-secondary:hover {
            background: #f5f5f7;
        }

        table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #d2d2d7;
            border-collapse: collapse;
        }

        thead {
            background: #f5f5f7;
        }

        th {
            text-align: left;
            padding: 1rem;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6e6e73;
        }

        td {
            padding: 1rem;
            border-top: 1px solid #d2d2d7;
        }

        tr:hover {
            background: #fafafa;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-contacted {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-enrolled {
            background: #d4edda;
            color: #155724;
        }

        .whatsapp-link {
            color: #25D366;
            text-decoration: none;
            font-weight: 500;
        }

        .whatsapp-link:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #6e6e73;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6e6e73;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            table {
                font-size: 0.875rem;
            }

            th, td {
                padding: 0.75rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Course Registrations</h1>
            <p style="color: #6e6e73; margin-top: 0.5rem;">PEISCL Admin</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Registrations</div>
                <div class="stat-value" id="totalCount">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">This Week</div>
                <div class="stat-value" id="weekCount">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Today</div>
                <div class="stat-value" id="todayCount">—</div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="filterTrack">Track</label>
                <select id="filterTrack" onchange="filterRegistrations()">
                    <option value="">All Tracks</option>
                    <option value="Data & AI">Data & AI</option>
                    <option value="Web & Office Skills">Web & Office Skills</option>
                    <option value="Digital & Security">Digital & Security</option>
                    <option value="Systems & Startup">Systems & Startup</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterStatus">Status</label>
                <select id="filterStatus" onchange="filterRegistrations()">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="contacted">Contacted</option>
                    <option value="enrolled">Enrolled</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchName">Search by Name</label>
                <input type="text" id="searchName" placeholder="Type to search..." oninput="filterRegistrations()">
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="loadRegistrations()">Refresh Data</button>
            <button class="btn-secondary" onclick="exportToCSV()">Export CSV</button>
        </div>

        <div id="tableContainer">
            <div class="loading">Loading registrations...</div>
        </div>
    </div>

    <script>
        let allRegistrations = [];
        let filteredRegistrations = [];

        // Load registrations on page load
        document.addEventListener('DOMContentLoaded', loadRegistrations);

        async function loadRegistrations() {
            try {
                // Try to fetch from API
                const response = await fetch('/api/registrations');
                const data = await response.json();

                if (data.success) {
                    allRegistrations = data.registrations;
                } else {
                    throw new Error('Failed to load');
                }
            } catch (error) {
                console.log('Backend unavailable, loading from localStorage');
                allRegistrations = JSON.parse(localStorage.getItem('registrations') || '[]');
            }

            filteredRegistrations = allRegistrations;
            updateStats();
            renderTable();
        }

        function updateStats() {
            const total = allRegistrations.length;
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

            const todayCount = allRegistrations.filter(r => {
                const date = new Date(r.timestamp);
                return date >= today;
            }).length;

            const weekCount = allRegistrations.filter(r => {
                const date = new Date(r.timestamp);
                return date >= weekAgo;
            }).length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('weekCount').textContent = weekCount;
        }

        function filterRegistrations() {
            const trackFilter = document.getElementById('filterTrack').value;
            const statusFilter = document.getElementById('filterStatus').value;
            const searchTerm = document.getElementById('searchName').value.toLowerCase();

            filteredRegistrations = allRegistrations.filter(reg => {
                const matchTrack = !trackFilter || reg.track === trackFilter;
                const matchStatus = !statusFilter || reg.status === statusFilter;
                const matchSearch = !searchTerm || reg.name.toLowerCase().includes(searchTerm);
                return matchTrack && matchStatus && matchSearch;
            });

            renderTable();
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');

            if (filteredRegistrations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No registrations yet</h2>
                        <p>Registrations will appear here when students sign up.</p>
                    </div>
                `;
                return;
            }

            const rows = filteredRegistrations
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                .map(reg => `
                    <tr>
                        <td><strong>${reg.name}</strong></td>
                        <td><a href="https://wa.me/${reg.whatsapp.replace(/\D/g, '')}" class="whatsapp-link" target="_blank">${reg.whatsapp}</a></td>
                        <td>${reg.program}</td>
                        <td>${reg.track || '—'}</td>
                        <td><span class="status-badge status-${reg.status || 'pending'}">${reg.status || 'pending'}</span></td>
                        <td>${new Date(reg.timestamp).toLocaleDateString()} ${new Date(reg.timestamp).toLocaleTimeString()}</td>
                    </tr>
                `).join('');

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>WhatsApp</th>
                            <th>Program</th>
                            <th>Track</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>
            `;
        }

        function exportToCSV() {
            const headers = ['Name', 'WhatsApp', 'Program', 'Track', 'Status', 'Timestamp'];
            const rows = filteredRegistrations.map(reg => [
                reg.name,
                reg.whatsapp,
                reg.program,
                reg.track || '',
                reg.status || 'pending',
                reg.timestamp
            ]);

            let csv = headers.join(',') + '\n';
            csv += rows.map(row => row.map(field => `"${field}"`).join(',')).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `registrations_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
    </script>
</body>
</html>
